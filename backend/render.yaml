services:
  - type: web
    name: ctas-backend
    env: node
    plan: free
    buildCommand: npm ci --production
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard
      - key: CORS_ORIGINS
        value: https://coastalguardian.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false # Set this in Render dashboard
      - key: NOAA_CDO_API_KEY
        sync: false # Set this in Render dashboard
      - key: AI_API_URL
        value: https://ctas-ai-models.onrender.com # Update after AI service deployed
    healthCheckPath: /api/health
    autoDeploy: true
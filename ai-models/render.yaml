# Render deployment configuration for AI Models service
services:
  - type: web
    name: ctas-ai-models
    env: python
    plan: starter
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENWEATHER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "https://coastal-threat-alert-system-two.vercel.app,https://ctas-backend.onrender.com"
    healthCheckPath: "/api/health"
    autoDeploy: true
# Free-tier single-service deployment for Render
# Runs both Node.js backend and Python AI models in one service

services:
  - type: web
    name: coastal-threat-alert-system
    env: python
    plan: free
    buildCommand: |
      # Install Python AI dependencies first
      pip install -r ai-models/requirements.txt
      # Install backend dependencies (Node.js is pre-installed in Python env)
      cd backend && npm ci --production && cd ..
    startCommand: bash start_combined.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_PATH
        value: /opt/render/project/src/backend/node_modules
      - key: AI_API_URL
        value: http://localhost:8000
      - key: MONGODB_URI
        sync: false # Set in Render dashboard
      - key: JWT_SECRET
        sync: false # Set in Render dashboard
      - key: CORS_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render dashboard
      - key: NOAA_CDO_API_KEY
        sync: false # Set in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true
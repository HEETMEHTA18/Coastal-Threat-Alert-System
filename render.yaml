# Root Render service configuration (combined) - temporary
# Recommended: deploy `backend` and `ai-models` as separate services.

services:
  - type: web
    name: coastal-threat-alert-system
    env: node
    plan: free
    buildCommand: |
      # Install Node backend dependencies
      cd backend && npm install
      # Install Python dependencies for AI models
      pip install -r ai-models/requirements.txt
    # Use bash to run combined startup script (avoids exec-permission issues)
    startCommand: bash start_combined.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NOAA_CDO_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
    healthCheckPath: /api/health
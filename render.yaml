# Single-service deployment for Render
# Runs both Node.js backend and Python AI models in one service

services:
  - type: web
    name: coastal-threat-alert-system
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render dashboard
      - key: JWT_SECRET
        sync: false # Set in Render dashboard
      - key: CORS_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render dashboard
      - key: NOAA_CDO_API_KEY
        sync: false # Set in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://coastal-threat-alert-system-two.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true